# 推送到 main 且存在可发布提交（feat/fix/perf 等）时：
# 1) release 任务：semantic-release 计算版本、同步各包 version、写 CHANGELOG、打 tag、创建 GitHub Release
# 2) package 任务：按 tag 在 macOS / Windows / Linux 上分别打包安装包并作为 Release 资产上传
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
      tag: ${{ steps.result.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm run lint && pnpm run typecheck && pnpm run format:check

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 避免 release 提交触发 husky 等与 CI 无关的钩子
          HUSKY: "0"
        run: pnpm exec semantic-release

      - name: Resolve release result
        id: result
        run: |
          TAG="$(git tag --points-at HEAD | head -n1)"
          if [ -n "$TAG" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "本次发布: $TAG"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "本次无可发布提交，跳过打包。"
          fi

  package:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: "--mac"
            pattern: "apps/desktop/release/*.dmg"
          - os: windows-latest
            platform: "--win"
            pattern: "apps/desktop/release/*.exe"
          - os: ubuntu-latest
            platform: "--linux"
            pattern: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # 仅在对应 Secret 非空时注入签名/公证环境变量；
      # 否则不设置，避免 electron-builder 把空的 CSC_LINK 当作证书路径（macOS 会报错）
      - name: Prepare signing env
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          emit() {
            if [ -n "${!1:-}" ]; then
              {
                echo "$2<<__WP_EOF__"
                printf '%s\n' "${!1}"
                echo "__WP_EOF__"
              } >> "$GITHUB_ENV"
            fi
          }
          emit MAC_CSC_LINK CSC_LINK
          emit MAC_CSC_KEY_PASSWORD CSC_KEY_PASSWORD
          emit APPLE_ID APPLE_ID
          emit APPLE_APP_SPECIFIC_PASSWORD APPLE_APP_SPECIFIC_PASSWORD
          emit APPLE_TEAM_ID APPLE_TEAM_ID
          emit WIN_CSC_LINK WIN_CSC_LINK
          emit WIN_CSC_KEY_PASSWORD WIN_CSC_KEY_PASSWORD

      - name: Package desktop
        run: pnpm --filter @wallpaper/desktop exec electron-builder ${{ matrix.platform }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 无 macOS 证书时关闭身份自动发现，走 ad-hoc 签名产出未签名 DMG（有证书时经上一步注入并正常签名）
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: ${{ matrix.pattern }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
