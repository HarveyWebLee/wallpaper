<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardLower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#2f9fe0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="226" fill="none" stroke="rgba(56,189,248,0.18)" stroke-width="4"/>

  <circle cx="512" cy="452" r="360" fill="url(#glow)" filter="url(#soft)"/>

  <circle cx="512" cy="470" r="330" fill="none" stroke="rgba(56,189,248,0.16)" stroke-width="20"/>
  <circle cx="512" cy="470" r="330" fill="none" stroke="url(#card)" stroke-width="20"
    stroke-linecap="round" stroke-dasharray="1493 2073" transform="rotate(-90 512 470)"/>

  <g>
    <rect x="316" y="248" width="392" height="470" rx="56" fill="#02101c" opacity="0.55" filter="url(#soft)"/>
    <rect x="326" y="246" width="372" height="226" rx="48" fill="url(#card)"/>
    <rect x="326" y="476" width="372" height="226" rx="48" fill="url(#cardLower)"/>
    <rect x="326" y="466" width="372" height="16" rx="8" fill="#02101c" opacity="0.65"/>
    <rect x="344" y="470" width="336" height="4" rx="2" fill="rgba(255,255,255,0.45)"/>
    <rect x="344" y="260" width="336" height="60" rx="30" fill="rgba(255,255,255,0.28)"/>
  </g>
</svg>
